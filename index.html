<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Klappe</title>
<meta name="description" content="Texte lernen, mit Szenenpartner proben, Self-Tapes drehen, Castings im Blick behalten.">
<meta name="theme-color" content="#0F1113">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
 <header class="appbar" id="appbar">
  <button class="ic" id="back" type="button" aria-label="Zurück" hidden><svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
  <h1 class="appbar-title" id="topTitle"></h1>
  <div class="appbar-act" id="topAct"></div>
 </header>
 <main class="view" id="view" tabindex="-1"></main>
 <button class="fab" id="fab" type="button" hidden></button>
 <nav class="nav" id="tabs" aria-label="Hauptnavigation">
  <a href="#start" data-tab="start"><span class="ind"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg></span><span>Heute</span></a>
  <a href="#skripte" data-tab="skripte"><span class="ind"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg></span><span>Skripte</span></a>
  <a href="#castings" data-tab="castings"><span class="ind"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8 14h4"/></svg></span><span>Castings</span></a>
  <a href="#radar" data-tab="radar"><span class="ind"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 12l5.5-5.5"/></svg><b class="badge" id="radarDot" hidden></b></span><span>Radar</span></a>
 </nav>
</div>
<div class="sheet" id="sheet" hidden>
 <div class="sheet-bg" data-close></div>
 <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="handle" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="ic" type="button" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-body" id="sheetBody"></div>
 </div>
</div>
<div class="snack" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf,.txt,text/plain" hidden>
<input type="file" id="photoInput" accept="image/*" hidden>
<script>
// Notfall: Startet die App nicht (z. B. nach einem Update), Offline-Speicher leeren und neu laden.
// Skripte, Takes, Tagebuch und Profil bleiben dabei erhalten.
(function () {
  function rescue() {
    if (window.__klappeOk || document.getElementById('rescue')) return;
    var v = document.getElementById('view');
    if (v && v.children.length) return; // App zeigt etwas an, also läuft sie
    var d = document.createElement('div');
    d.id = 'rescue';
    d.style.cssText = 'position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#0F1113;color:#ECE8E1;font:16px/1.45 system-ui,sans-serif;text-align:center';
    var info = window.__klappeErr || 'Meist hilft es, die App neu zu laden. Deine Skripte, Takes und dein Tagebuch bleiben erhalten.';
    var detail = window.__klappeLast ? '<small style="color:#7A8089;max-width:320px;word-break:break-word">Fehler: ' + String(window.__klappeLast).replace(/[<>&]/g, '') + '</small>' : '';
    d.innerHTML = '<b style="font-size:1.2rem">Klappe startet gerade nicht</b><span style="color:#A7ACB4;max-width:320px">' + info + '</span>' + detail + '<button type="button" style="min-height:48px;padding:0 24px;border:0;border-radius:24px;background:#D4B072;color:#1F1708;font:600 1rem system-ui,sans-serif">App neu laden</button>';
    d.querySelector('button').onclick = function () {
      var jobs = [];
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k !== 'klappe-share'; }).map(function (k) { return caches.delete(k); })); }));
      Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
    };
    document.body.appendChild(d);
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName !== 'SCRIPT') return; // fehlende Bilder o. Ä. ignorieren
    window.__klappeLast = e.message || (t && t.src) || 'Skriptfehler';
    if (!window.__klappeOk) setTimeout(rescue, 300);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { window.__klappeLast = (e.reason && (e.reason.message || e.reason)) || 'Fehler'; if (!window.__klappeOk) setTimeout(rescue, 300); });
  window.addEventListener('klappe-blocked', function () { setTimeout(rescue, 1500); });
  setTimeout(rescue, 9000);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
